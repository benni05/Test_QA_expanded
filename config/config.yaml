testing:
  # Set at least two of the three; the third follows from them
  sampling:
    measurements_count: 20
    total_duration_seconds: null
    sampling_frequency_hz: 10

# Connection settings per ammeter type. Optional keys: host (default "localhost"), timeout_seconds (default 2.0), enabled (default true),
# sampling (replaces testing.sampling for this ammeter), error_rate (0 to 1) and error_seed (simulate failed reads).
ammeters:
  greenlee:
    port: 5001
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5002
    command: "MEASURE_ENTES -get_data"
    error_rate: 0        # fraction of reads that fail on purpose (0.6 = 60%); 0 turns the simulation off
    error_seed: 1        # optional, makes the failures repeatable

  circutor:
    port: 5003
    command: "MEASURE_CIRCUTOR -get_measurement"

# statistical_metrics: any of mean, median, std_dev, min, max.
analysis:
  statistical_metrics: [mean, median, std_dev, min, max]
  visualization:
    enabled: true
    # plot_types draw one figure per ammeter: time_series, histogram, rolling_stats. comparison_plots compare the ammeters of a run: normalized_boxplot, bias.
    plot_types: [time_series, histogram, rolling_stats]
    comparison_plots: [normalized_boxplot, bias]
    output_dir: results/plots
  accuracy:
    confidence_level: 0.95
    # Expected mean current (A) of each emulator, derived from the input ranges in the README: greenlee = 5.5 V * ln(1000) / 99.9 ohm, entes = 0.055 T * 1250, circutor = 10 * 0.55 V * 0.0055 s
    expected_current_a: {greenlee: 0.3803, entes: 68.75, circutor: 0.03025}

# Where finished runs are archived, one JSON file per run
result_management:
  directory: results/runs
